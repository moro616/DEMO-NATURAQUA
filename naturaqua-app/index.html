<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Naturaqua · Gestión de sodería</title>
  <meta name="description" content="Demo del sistema de gestión para Naturaqua: clientes, reparto, cobranzas, stock, dispensers y WhatsApp.">
  <meta name="theme-color" content="#1B365D">
  <link rel="icon" type="image/png" href="assets/icono.png">
  <link rel="apple-touch-icon" href="assets/icono-192.png">
  <link rel="manifest" href="manifest.json">
  <script>
    // Tema claro/oscuro: respeta la elección guardada o la configuración del dispositivo
    (function () {
      var t = null;
      try { t = localStorage.getItem('naturaqua-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
